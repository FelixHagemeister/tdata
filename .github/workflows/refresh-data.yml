name: Refresh dataset
# Rebuilds the harmonized dataset from the upstream open-data files (RKI, Destatis)
# and opens a pull request when anything changed. Runs monthly and on demand.
on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python scripts/build_dataset.py
      - run: pytest -q
      - uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Refresh harmonized dataset from upstream sources"
          title: "Refresh harmonized dataset"
          body: "Automated rebuild of dataset/indicators.csv and docs/data/ from the upstream open-data files."
          branch: auto/refresh-dataset
