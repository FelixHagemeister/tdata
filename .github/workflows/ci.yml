name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Check that the committed dataset is up to date with the extractors
        run: |
          python scripts/build_dataset.py
          git diff --stat --exit-code -- dataset/indicators.csv docs/data/catalog.json docs/data/sources.json \
            || echo "::warning::dataset changed after rebuild – upstream data may have been updated; commit the rebuilt files"
