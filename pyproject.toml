[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tobacco-gateway"
version = "0.1.0"
description = "A public data gateway for tobacco datasets — Munich → Bavaria → Germany"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "pandas>=2.0",
    "requests>=2.31",
    "pyreadstat>=1.2",
    "pdfplumber>=0.10",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "jupyter",
    "ipykernel",
    "matplotlib",
    "seaborn",
    "pytest",
]

[tool.hatch.build.targets.wheel]
packages = ["tobacco_gateway"]
